# Build and run the game — the client, the party server, the content library,
# saved levels and classes, and the AI bridge — in one container, with its
# PostgreSQL database in a second:
#
#   docker compose up --build          → http://localhost:8787
#
# The database is reachable only from the game container (no port published).
# Set POSTGRES_PASSWORD in .env. Old SQLite data in ./data (game.sqlite,
# library.sqlite) is brought into PostgreSQL on the first start, once.
#
# The AI model itself is *not* in here. It runs wherever LLM_PLATFORM_BASE_URL
# points — LM Studio on the LAN, Ollama, vLLM, anything OpenAI-compatible —
# and this container only holds the key and forwards the call. Without it the
# game still runs; only the chat commander, the Class forge and AI maps fall
# back to their keyword modes.
#
# Put it on the internet behind HTTPS (see docs/production.md): a reverse
# proxy that forwards WebSocket upgrades on /ws, and TRUST_PROXY=1 here so
# rate limits see real addresses.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gamory
      POSTGRES_USER: gamory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-dot-env}
    volumes:
      # Accounts, characters, the item registry, the history, the library. Back it up
      # (docs/production.md: pg_dump).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamory -d gamory']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  game:
    build: .
    image: gamory
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8787:8787'
    environment:
      PORT: 8787
      STATIC_ROOT: /app/dist
      DATA_DIR: /app/data
      DATABASE_URL: postgres://gamory:${POSTGRES_PASSWORD:-change-me-in-dot-env}@db:5432/gamory
      # Read from .env (compose loads it automatically). Nothing here has a
      # default: an unset base URL makes the bridge report itself offline, and
      # the game falls back to its own keyword parser rather than breaking.
      LLM_PLATFORM_BASE_URL: ${LLM_PLATFORM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL1: ${LLM_MODEL1:-}
      LLM_MODEL2: ${LLM_MODEL2:-}
      # The key that seals characters and chains the history (base64, 32+ bytes:
      # `openssl rand -base64 48`). Unset: one is made in ./data/server.key.
      SERVER_SECRET: ${SERVER_SECRET:-}
      # New accounts per address per day (raise it for a LAN party behind one address).
      ACCOUNTS_PER_ADDRESS_PER_DAY: ${ACCOUNTS_PER_ADDRESS_PER_DAY:-5}
      # Playing together: players per party (2–8, default 4).
      MAX_PLAYERS: ${MAX_PLAYERS:-4}
      # 1 when a reverse proxy sits in front (X-Forwarded-For is then trusted).
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Only needed if the page is served from a *different* origin than this
      # container. Same-origin (the default) needs no CORS.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Image → 3D model generation (optional): one of these keys.
      TRIPO_API_KEY: ${TRIPO_API_KEY:-}
      MESHY_API_KEY: ${MESHY_API_KEY:-}
      MODELGEN_PROVIDER: ${MODELGEN_PROVIDER:-}
    volumes:
      # Levels and classes players save, and the server key (which seals the
      # characters in the database — without it they cannot be opened). Keep it,
      # and back it up with the database.
      - ./data:/app/data
      # The 3D asset library, downloaded on the host with `npm run library:fetch`.
      - ./library:/app/library:ro
      # Uploads and generated models are written here, so this one is writable.
      - ./library/my-models:/app/library/my-models
    # A model on the host rather than the LAN: point the base URL at
    # http://host.docker.internal:1234/v1 and keep this mapping.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  pgdata:
