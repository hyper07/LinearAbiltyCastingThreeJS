<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Weekly learning report</title>
    <style>
      body { margin: 0; background: #f6f1e4; font-family: 'Nunito Variable', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      @media (prefers-color-scheme: dark) { body { background: #121715; color: #f0efec; } }
      main { max-width: 860px; margin: 0 auto; padding: 16px; }
      .brand { font-weight: 900; letter-spacing: 0.06em; color: #2c6b62; margin: 4px 0 12px; }
      .brand span { color: #d98a1f; }
      @media (prefers-color-scheme: dark) { .brand { color: #8fd6c9; } }
      .msg { padding: 20px; border-radius: 16px; background: rgba(127, 127, 127, 0.1); font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">🦉 <span>AI</span> ARCADEMIA · for parents</p>
      <div id="report"><p class="msg">Loading the report…</p></div>
    </main>
    <script type="module" src="./src/arcademia/sharedReport.js"></script>
  </body>
</html>
