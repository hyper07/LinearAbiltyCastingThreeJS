<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motion lab</title>
<!-- Dev-only: npm run dev, then /motion-lab.html. Not part of the build. The motion study's proof:
     a humanoid dance retargeted onto a big-head humanoid and onto Kickrani's plush riders, and the
     beat-synced procedural dance from src/shared/motion/dance.js. Notes: knowledge/motion-study.md. -->
<style>
  :root { --bg: #1b1d2b; --panel: rgba(20, 22, 34, 0.82); --ink: #f2efe8; --muted: #a9aab8; --line: rgba(255, 255, 255, 0.12); --accent: #ffb547; --beat: #ff6fb4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
  canvas { display: block; }
  .bar { position: fixed; left: 12px; right: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(6px); }
  .bar b { font-size: 15px; margin-right: 6px; }
  .bar label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  select, input, button { font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  input[type='number'] { width: 64px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .count { display: flex; gap: 4px; margin-left: auto; }
  .count span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: var(--muted); border: 1px solid var(--line); }
  .count span.on { background: var(--beat); color: #1b1d2b; border-color: var(--beat); font-weight: 700; }
  .label { position: fixed; transform: translate(-50%, 0); text-align: center; pointer-events: none; font-size: 12px; color: var(--muted); white-space: nowrap; text-shadow: 0 1px 2px #000; }
  .label b { display: block; color: var(--ink); font-size: 13px; }
  .now { position: fixed; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; color: var(--muted); max-width: calc(100% - 24px); }
  .now b { color: var(--ink); }
</style>
</head>
<body>
<div class="bar">
  <b>Motion lab</b>
  <label>Clip <select id="clip"></select></label>
  <label>BPM <input id="bpm" type="number" min="60" max="200" step="0.1" value="143.6" /></label>
  <button id="combo">New combo</button>
  <button id="music">Play the podium track</button>
  <button id="pause">Pause</button>
  <div class="count" id="count"></div>
</div>
<div class="now" id="now">Loading…</div>
<script type="module" src="/src/shared/motion/lab.js"></script>
</body>
</html>
